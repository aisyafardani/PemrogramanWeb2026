    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>TOKU-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Transaksi Pembelian</h2>
            <form id="form-tambah">
                <p>
                    <label for="nama">No. Nota / Transaksi</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="no_anggota">Nama Pembeli</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="alamat">Judul Buku</label><br>
                    <input type="text" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="no_hp">Nama Penerbit</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <label for="no_hp">Jumlah Beli</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <button type="submit">Simpan Transaksi</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
